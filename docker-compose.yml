services:
  mysql:
    image: mysql:8.0
    container_name: green_be_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: '1234'
      MYSQL_DATABASE: lab_ai_db
      MYSQL_USER: lab_ai_user
      MYSQL_PASSWORD: '1234'
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p1234']
      timeout: 20s
      retries: 10
      interval: 5s
    networks:
      - green_network

volumes:
  mysql_data:
    driver: local

networks:
  green_network:
    driver: bridge